# ═══════════════════════════════════════════════════════════════════════════
# Excelsia ERP — production compose
# ═══════════════════════════════════════════════════════════════════════════
# Differences vs. docker-compose.yml (dev):
#   - No host ports exposed on databases/minio — they are reachable only
#     inside the `excelsia-net` bridge network. Only nginx listens on 80/443.
#   - `restart: always` so crashes and reboots recover automatically.
#   - No default passwords — every secret is required via env vars; the
#     container will fail to start if they're missing.
#   - Healthchecks keep their defaults from the dev compose so orchestrators
#     can gate dependent services.
#
# Start with:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# The nginx service expects a reverse-proxy config in infra/nginx/prod.conf
# that terminates TLS and forwards to `api:3001` (NestJS) and `web:3000`
# (Next.js). See docs/DEPLOYMENT.md for the TLS + backup setup.
# ═══════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    container_name: excelsia-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - excelsia-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: excelsia-redis
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - excelsia-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: excelsia-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks:
      - excelsia-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: excelsia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - excelsia-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/${MINIO_BUCKET:-excelsia-documents} --ignore-existing;
      exit 0;
      "
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: excelsia-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    networks:
      - excelsia-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: excelsia-web
    restart: always
    depends_on:
      - api
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - excelsia-net

  nginx:
    image: nginx:alpine
    container_name: excelsia-nginx
    restart: always
    depends_on:
      - api
      - web
    # Only nginx is reachable from the public Internet; everything else
    # stays on the internal bridge.
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - excelsia-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  excelsia-net:
    driver: bridge

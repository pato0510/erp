# ═══════════════════════════════════════════════════════════════════════════
# Excelsia ERP — production nginx reverse proxy
# ═══════════════════════════════════════════════════════════════════════════
# Fronts the compose stack:
#   /         → web (Next.js)   at http://web:3000
#   /api/*    → api (NestJS)    at http://api:3001
#   /_next/*  → web static assets (served directly by Next's standalone
#               server so etag/immutable cache headers propagate)
#
# Terminates TLS on 443 (certs mounted at /etc/nginx/certs). HTTP on 80
# unconditionally redirects to HTTPS.
#
# Helmet on the API already sets CSP/HSTS/X-Frame-Options, so we don't
# double them here. nginx only adds headers that the app can't (referrer
# policy on static assets, SSL redirect, etc.).
# ═══════════════════════════════════════════════════════════════════════════

# Upstream definitions — match service names in docker-compose.prod.yml.
upstream excelsia_api {
  server api:3001 max_fails=3 fail_timeout=30s;
  keepalive 32;
}

upstream excelsia_web {
  server web:3000 max_fails=3 fail_timeout=30s;
  keepalive 32;
}

# Map the WebSocket Upgrade header to the value of the Connection header that
# nginx should forward upstream. Declared at the http level so both server
# blocks can reference $connection_upgrade.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Gzip — compress text payloads (JSON, HTML, CSS, JS).
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  application/javascript
  application/json
  application/xml
  application/xml+rss
  application/manifest+json
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;

# HTTP → HTTPS redirect. In dev you can comment this and listen on :80
# directly, but production should always be HTTPS-only.
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Let ACME challenges through for certbot renewals.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Main HTTPS server.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  # TLS — mount real certs at /etc/nginx/certs/{fullchain.pem,privkey.pem}.
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # Body size — cap uploads (movement/cartola imports top out at 10 MB).
  client_max_body_size 15M;

  # Proxy timeouts — match BullMQ job polling + large report exports.
  proxy_connect_timeout 30s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # Security headers complementing Helmet (static assets pass through nginx
  # without going through Helmet, so we add minimum headers here too).
  add_header X-Frame-Options           "DENY" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ─────────────────────────────────────────────────────────────────────
  # API — /api/* → NestJS
  # Requests preserve the path so controllers with @Controller('foo') map
  # to /api/foo exactly as Nest's globalPrefix expects.
  # ─────────────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass         http://excelsia_api;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade path — BullMQ admin dashboards and future Sentry
    # live-tail plugins rely on it.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cookies must flow both ways for HttpOnly JWT auth.
    proxy_set_header Cookie $http_cookie;
    proxy_pass_request_headers on;
  }

  # ─────────────────────────────────────────────────────────────────────
  # Next.js static assets — served with long cache since filenames are
  # content-hashed.
  # ─────────────────────────────────────────────────────────────────────
  location /_next/static/ {
    proxy_pass         http://excelsia_web;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Proto $scheme;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # ─────────────────────────────────────────────────────────────────────
  # Frontend — everything else → Next.js standalone server.
  # ─────────────────────────────────────────────────────────────────────
  location / {
    proxy_pass         http://excelsia_web;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket (Next.js HMR in dev, future realtime features in prod).
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

